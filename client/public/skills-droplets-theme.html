<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayush Prajapati · Skills (Realistic 3D Liquid Droplets Theme)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* REALISTIC 3D LIQUID PALETTE */
      --bg-dark: #0a1118; 
      --bg-mid: #1e3a4d; 
      
      --nav-bg: rgba(15, 30, 40, 0.6);
      --text-main: #f0f8ff;
      --text-muted: #8caab9;
      
      --accent-1: #38bdf8; /* Vibrant water blue */
      --accent-2: #0ea5e9;
      --accent-3: #a259ff;
      --accent-glow: rgba(56, 189, 248, 0.4);
      
      --border: rgba(255, 255, 255, 0.12);
      --card-bg: rgba(15, 30, 40, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; position: relative; min-height: 100vh; }

    /* =========================================
       REALISTIC 3D LIQUID BACKGROUND
       ========================================= */
    .liquid-bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; pointer-events: none; background: linear-gradient(135deg, #0a1118 0%, #1e3a4d 50%, #0d2c3d 100%); }
    .liquid-bg::after { content: ''; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"); mix-blend-mode: overlay; opacity: 0.8; }

    /* 3D Droplets / Spheres */
    .spheres-container { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; perspective: 1000px; }
    .droplet { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(56, 189, 248, 0.2) 40%, rgba(0,0,0,0.6) 80%); box-shadow: inset 0 10px 20px rgba(255,255,255,0.4), inset 0 -10px 20px rgba(0,0,0,0.6), 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(5px); animation: floatDroplet 20s infinite linear; will-change: transform; }
    .droplet:nth-child(1) { width: 350px; height: 350px; left: -10%; top: 10%; animation-duration: 25s; }
    .droplet:nth-child(2) { width: 180px; height: 180px; right: 10%; top: 20%; animation-duration: 18s; animation-delay: -5s; }
    .droplet:nth-child(3) { width: 250px; height: 250px; left: 25%; bottom: -10%; animation-duration: 30s; animation-delay: -10s; }
    .droplet:nth-child(4) { width: 100px; height: 100px; right: 30%; bottom: 20%; animation-duration: 15s; animation-delay: -2s; }
    .droplet:nth-child(5) { width: 150px; height: 150px; left: 60%; top: 50%; animation-duration: 22s; animation-delay: -8s; }
    .droplet:nth-child(6) { width: 80px; height: 80px; left: 15%; top: 60%; animation-duration: 12s; animation-delay: -4s; }
    @keyframes floatDroplet { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(-60px) scale(1.05); } 100% { transform: translateY(0) scale(1); } }

    .bg-noise { position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E"); z-index: -1; pointer-events: none; }
    .mouse-light { position: fixed; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 60%); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 0; top: 0; left: 0; transition: opacity 0.3s; }

    /* ===== NAVBAR ===== */
    .nav-wrapper { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1150px; z-index: 9999; perspective: 1200px; will-change: transform; }
    .nav-beam-container { position: relative; border-radius: 60px; padding: 1.5px; overflow: hidden; background: rgba(255, 255, 255, 0.05); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); }
    .nav-beam { position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent 0%, transparent 70%, var(--accent-1) 85%, var(--accent-2) 100%); transform-origin: center; animation: rotateBeam 4s linear infinite; opacity: 0; transition: opacity 0.4s; z-index: 0; }
    .nav-beam-container:hover .nav-beam { opacity: 1; }
    @keyframes rotateBeam { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    .navbar { position: relative; display: flex; align-items: center; justify-content: space-between; background: var(--nav-bg); backdrop-filter: blur(30px) saturate(200%); border-radius: 58px; padding: 8px 14px 8px 20px; transform-style: preserve-3d; z-index: 1; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
    .navbar::before { content: ""; position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 60%); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); top: var(--mouse-y, 50%); left: var(--mouse-x, 50%); opacity: 0; transition: opacity 0.3s; z-index: 0; }
    .nav-beam-container:hover .navbar::before { opacity: 1; }

    .nav-left { display: flex; align-items: center; gap: 14px; transform: translateZ(40px); cursor: pointer; position: relative; z-index: 2; }
    .logo-box { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #000; position: relative; box-shadow: 0 8px 20px var(--accent-glow); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .nav-left:hover .logo-box { transform: scale(1.1) rotate(15deg); }
    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }

    .nav-center { position: relative; display: flex; align-items: center; background: rgba(0, 0, 0, 0.4); border-radius: 50px; padding: 5px; transform: translateZ(25px); border: 1px solid rgba(255, 255, 255, 0.05); z-index: 2; }
    .active-pill { position: absolute; top: 5px; left: 5px; height: calc(100% - 10px); background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-radius: 50px; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1; box-shadow: 0 0 25px var(--accent-glow); }
    .nav-link { position: relative; z-index: 2; text-decoration: none; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 50px; transition: color 0.3s; display: flex; align-items: center; gap: 7px; outline: none; }
    .nav-link:hover, .nav-link.active, .nav-link:focus-visible { color: #fff; }

    .kbd-pill { font-size: 10px; background: rgba(255, 255, 255, 0.12); padding: 2px 6px; border-radius: 4px; margin-left: 4px; font-family: 'JetBrains Mono', monospace; color: #ccc; border: 1px solid rgba(255,255,255,0.1); }

    .nav-right { display: flex; align-items: center; gap: 10px; transform: translateZ(40px); position: relative; z-index: 2; }
    .btn-outline { background: transparent; border: 1px solid rgba(255, 255, 255, 0.15); color: white; padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; align-items: center; gap: 8px; outline: none; }
    .btn-outline:hover, .btn-outline:focus-visible { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-1); transform: translateY(-2px); box-shadow: 0 10px 25px var(--accent-glow); }
    .btn-primary { position: relative; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border: none; color: #000; padding: 10px 24px; border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; overflow: hidden; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); outline: none; }
    .btn-primary:hover, .btn-primary:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 25px var(--accent-glow); }
    .btn-primary::after { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: left 0.5s; }
    .btn-primary:hover::after { left: 100%; }
    .magnetic { display: inline-block; }

    /* ===== SKILLS SECTION ===== */
    .skills-section { padding: 180px 5% 100px; max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; perspective: 2000px; }

    .skills-header { text-align: center; margin-bottom: 50px; transform-style: preserve-3d; }
    
    .skills-subtitle {
      color: var(--accent-1); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; font-weight: 700;
      margin-bottom: 12px; display: block; text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-1)); background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }

    .skills-title {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 700; line-height: 1.1; letter-spacing: -1.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, var(--accent-1) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-size: 200% auto; animation: shimmer 6s linear infinite; transform: translateZ(30px); margin-bottom: 16px;
    }

    /* Filter buttons */
    .filter-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 50px; transform: translateZ(20px); }

    .filter-btn {
      position: relative; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); color: var(--text-muted);
      padding: 10px 24px; border-radius: 40px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden; transform-style: preserve-3d; isolation: isolate;
    }
    .filter-btn::before {
      content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(56, 189, 248, 0.9), transparent 60%), radial-gradient(circle at 70% 50%, rgba(14, 165, 233, 0.7), transparent 60%);
      opacity: 0; z-index: -2; transition: opacity 0.4s ease; filter: blur(10px);
    }
    .filter-btn::after {
      content: ""; position: absolute; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.2); border-radius: 50%;
      top: var(--mouse-y, 50%); left: var(--mouse-x, 50%); transform: translate(-50%, -50%); opacity: 0; z-index: -1; transition: opacity 0.3s; pointer-events: none;
    }
    .filter-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); }
    .filter-btn:hover::before { opacity: 1; }
    .filter-btn:hover::after { opacity: 1; }
    .filter-btn.active { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #000; border-color: transparent; box-shadow: 0 0 35px rgba(56, 189, 248, 0.5); font-weight: 700; }
    .filter-btn.active::before, .filter-btn.active::after { display: none; }

    /* ===== UNIFORM SKILLS GRID ===== */
    .skills-grid {
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
      gap: 16px;
      perspective: 1500px; 
      grid-auto-flow: dense;
    }

    /* Skill card - uniform size */
    .skill-card {
      position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px;
      display: flex; align-items: center; gap: 14px; cursor: pointer; transform-style: preserve-3d;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); overflow: hidden; will-change: transform; backdrop-filter: blur(10px);
    }

    .skill-card::before {
      content: ""; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
      background: radial-gradient(350px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.2), transparent 50%);
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 0;
    }

    .skill-card::after {
      content: ""; position: absolute; inset: 0; border-radius: 18px; padding: 1.5px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.7), transparent 40%, transparent 60%, rgba(14, 165, 233, 0.7));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 2;
    }

    .skill-card:hover::before { opacity: 1; }
    .skill-card:hover::after { opacity: 1; }
    .skill-card:hover {
      transform: translateY(-2px);
      border-color: transparent; background: rgba(20, 40, 55, 0.6);
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(56, 189, 248, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .ripple { position: absolute; border-radius: 50%; background: rgba(56, 189, 248, 0.4); transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none; z-index: 5; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .skill-icon-wrapper {
      position: relative; width: 44px; height: 44px; background: rgba(0, 0, 0, 0.4); border-radius: 12px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); transform: translateZ(30px); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1; flex-shrink: 0;
    }

    .skill-card:hover .skill-icon-wrapper { transform: translateZ(60px) scale(1.12) rotate(5deg); }

    .skill-icon-wrapper img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); }
    .invert-icon { filter: brightness(0) invert(1) drop-shadow(0 4px 8px rgba(0,0,0,0.6)) !important; }

    .skill-text { display: flex; flex-direction: column; transform: translateZ(20px); z-index: 1; transition: transform 0.3s; }
    .skill-card:hover .skill-text { transform: translateZ(35px); }
    .skill-name { font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600; color: #FFFFFF; letter-spacing: 0.2px; line-height: 1.2; }

    .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 14px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px dashed var(--border); }

    @media (max-width: 1024px) { .nav-center { display: none; } }
    @media (max-width: 768px) {
      .skills-grid { grid-template-columns: repeat(2, 1fr); }
      .skill-card { padding: 14px 16px; }
      .skill-icon-wrapper { width: 36px; height: 36px; }
      .skill-icon-wrapper img { width: 20px; height: 20px; }
    }
    @media (max-width: 480px) {
      .skills-grid { grid-template-columns: 1fr; }
      .filter-btn { padding: 8px 16px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <!-- REALISTIC 3D BACKGROUND -->
  <div class="liquid-bg"></div>
  <div class="spheres-container">
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
  </div>
  <div class="bg-noise"></div>
  <div class="mouse-light" id="mouseLight"></div>

  <!-- NAVBAR -->
  <div class="nav-wrapper" id="navWrapper">
    <div class="nav-beam-container">
      <div class="nav-beam"></div>
      <nav class="navbar" id="navbar">
        <div class="nav-left">
          <div class="logo-box">AP</div>
          <div class="logo-text">Ayush Prajapati</div>
        </div>
        <div class="nav-center" id="navCenter">
          <div class="active-pill" id="activePill"></div>
          <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
          <a href="about.html" class="nav-link"><i class="fa-regular fa-user"></i> About</a>
          <a href="skills.html" class="nav-link active"><i class="fa-solid fa-code"></i> Skills</a>
          <a href="projects.html" class="nav-link"><i class="fa-solid fa-layer-group"></i> Projects</a>
          <a href="certificates.html" class="nav-link"><i class="fa-solid fa-certificate"></i> Certificates</a>
          <a href="contact.html" class="nav-link"><i class="fa-regular fa-envelope"></i> Contact <span class="kbd-pill">⌘K</span></a>
        </div>
        <div class="nav-right">
          <div class="magnetic"><button class="btn-outline">Resume <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 10px;"></i></button></div>
          <div class="magnetic"><button class="btn-primary">Hire / Connect</button></div>
        </div>
      </nav>
    </div>
  </div>

  <!-- SKILLS SECTION -->
  <main class="skills-section">
    <div class="skills-header">
      <span class="skills-subtitle">03 · Technical Capabilities</span>
      <h2 class="skills-title">Interactive Skills &<br>Tech Stack</h2>
    </div>

    <div class="filter-container">
      <button class="filter-btn magnetic active" data-filter="all">All Stack</button>
      <button class="filter-btn magnetic" data-filter="languages">Languages</button>
      <button class="filter-btn magnetic" data-filter="frontend">Frontend</button>
      <button class="filter-btn magnetic" data-filter="backend">Backend</button>
      <button class="filter-btn magnetic" data-filter="database">Databases</button>
      <button class="filter-btn magnetic" data-filter="tools">Tools</button>
    </div>

    <div class="skills-grid" id="skillsGrid">
      <!-- Skills injected by JS -->
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- audio tick ----
    let audioCtx;
    function playTick() {
      if (reduceMotion) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
        gainNode.gain.setValueAtTime(0.015, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04);
      } catch(e) {}
    }

    // ---- NAVBAR logic ----
    const navLinks = document.querySelectorAll('.nav-link');
    const activePill = document.getElementById('activePill');
    const navCenter = document.getElementById('navCenter');
    const navbar = document.getElementById('navbar');
    const navWrapper = document.getElementById('navWrapper');

    function setPillPosition(element) {
      if (!element || navCenter.offsetParent === null) return;
      const rect = element.getBoundingClientRect();
      const parentRect = navCenter.getBoundingClientRect();
      if (parentRect.width === 0) return;
      activePill.style.width = `${rect.width}px`;
      activePill.style.left = `${rect.left - parentRect.left}px`;
    }

    window.addEventListener('load', () => setPillPosition(document.querySelector('.nav-link.active')));
    window.addEventListener('resize', () => setPillPosition(document.querySelector('.nav-link.active')));
    setTimeout(() => setPillPosition(document.querySelector('.nav-link.active')), 150);

    navLinks.forEach(link => {
      link.addEventListener('mouseenter', () => {
        playTick();
        setPillPosition(link);
        activePill.style.background = 'rgba(255, 255, 255, 0.2)';
        activePill.style.boxShadow = 'none';
      });
      link.addEventListener('mouseleave', () => {
        const activeLink = document.querySelector('.nav-link.active');
        setPillPosition(activeLink);
        activePill.style.background = 'linear-gradient(135deg, var(--accent-1), var(--accent-2))';
        activePill.style.boxShadow = '0 0 25px var(--accent-glow)';
      });
    });

    if (!reduceMotion) {
      navWrapper.addEventListener('mousemove', (e) => {
        const rect = navbar.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        gsap.to(navbar, {
          rotateX: ((y - rect.height / 2) / rect.height) * -8,
          rotateY: ((x - rect.width / 2) / rect.width) * 8,
          transformPerspective: 1200,
          duration: 0.4
        });
        navbar.style.setProperty('--mouse-x', `${x}px`);
        navbar.style.setProperty('--mouse-y', `${y}px`);
        gsap.to(navWrapper, { x: (x - rect.width / 2) * 0.04, y: (y - rect.height / 2) * 0.04, duration: 0.6 });
      });
      navWrapper.addEventListener('mouseleave', () => {
        gsap.to(navbar, { rotateX: 0, rotateY: 0, duration: 1, ease: "elastic.out(1, 0.3)" });
        gsap.to(navWrapper, { x: 0, y: 0, duration: 1, ease: "elastic.out(1, 0.3)" });
      });

      document.querySelectorAll('.magnetic').forEach(el => {
        el.addEventListener('mousemove', (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          gsap.to(el, { x: (x - rect.width / 2) * 0.25, y: (y - rect.height / 2) * 0.25, duration: 0.4, ease: "power2.out" });
          if (el.classList.contains('filter-btn')) {
            el.style.setProperty('--mouse-x', `${x}px`);
            el.style.setProperty('--mouse-y', `${y}px`);
          }
        });
        el.addEventListener('mouseleave', () => gsap.to(el, { x: 0, y: 0, duration: 0.8, ease: "elastic.out(1, 0.3)" }));
      });
    }

    // scroll shrink
    let scrollState = false;
    window.addEventListener('scroll', () => {
      const s = window.scrollY > 50;
      if (s === scrollState) return;
      scrollState = s;
      if (reduceMotion) return;
      if (s) {
        gsap.to('.nav-wrapper', { width: '85%', y: -10, duration: 0.5 });
        gsap.to('.navbar', { backgroundColor: 'rgba(10, 17, 24, 0.95)', duration: 0.5 });
      } else {
        gsap.to('.nav-wrapper', { width: '92%', y: 0, duration: 0.5 });
        gsap.to('.navbar', { backgroundColor: 'var(--nav-bg)', duration: 0.5 });
      }
    }, { passive: true });

    // ---- SKILLS DATA ----
    const skillsData = [
      { name: "C", category: "languages", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/c/c-original.svg" },
      { name: "Java", category: "languages", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" },
      { name: "Python", category: "languages", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" },
      { name: "JavaScript", category: "languages", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" },
      { name: "TypeScript", category: "languages", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg" },
      { name: "HTML5", category: "frontend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" },
      { name: "CSS3", category: "frontend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" },
      { name: "React.js", category: "frontend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" },
      { name: "Tailwind", category: "frontend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg" },
      { name: "Node.js", category: "backend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" },
      { name: "Express.js", category: "backend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/express/express-original.svg", invert: true },
      { name: "REST APIs", category: "backend", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/fastapi/fastapi-original.svg" },
      { name: "MongoDB", category: "database", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg" },
      { name: "MySQL", category: "database", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" },
      { name: "PostgreSQL", category: "database", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" },
      { name: "Git", category: "tools", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" },
      { name: "GitHub", category: "tools", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg", invert: true },
      { name: "Postman", category: "tools", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postman/postman-original.svg" },
      { name: "Docker", category: "tools", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg" }
    ];

    const grid = document.getElementById('skillsGrid');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderSkills(filter = 'all') {
      grid.innerHTML = '';
      const filteredSkills = filter === 'all' ? skillsData : skillsData.filter(skill => skill.category === filter);

      if (filteredSkills.length === 0) {
        grid.innerHTML = `<div class="no-results">✨ No skills in this category yet — check back soon.</div>`;
        return;
      }

      filteredSkills.forEach((skill) => {
        const card = document.createElement('div');
        card.className = 'skill-card';
        card.innerHTML = `
          <div class="skill-icon-wrapper">
            <img src="${skill.icon}" alt="${skill.name}" class="${skill.invert ? 'invert-icon' : ''}" loading="lazy">
          </div>
          <div class="skill-text">
            <div class="skill-name">${skill.name}</div>
          </div>
        `;
        grid.appendChild(card);

        // 3D tilt + glow tracking
        if (!reduceMotion) {
          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const rotateX = ((y - rect.height / 2) / rect.height) * -14;
            const rotateY = ((x - rect.width / 2) / rect.width) * 14;

            gsap.to(card, { rotateX: rotateX, rotateY: rotateY, transformPerspective: 1000, duration: 0.4, ease: "power2.out" });
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
          });

          card.addEventListener('mouseleave', () => {
            gsap.to(card, { rotateX: 0, rotateY: 0, duration: 1, ease: "elastic.out(1, 0.4)" });
          });
        }

        // ripple effect on click
        card.addEventListener('click', (e) => {
          playTick();
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const ripple = document.createElement('span');
          ripple.className = 'ripple';
          ripple.style.left = `${x}px`;
          ripple.style.top = `${y}px`;
          ripple.style.width = ripple.style.height = '30px';

          card.appendChild(ripple);

          setTimeout(() => ripple.remove(), 700);
        });
      });

      // animate in
      if (window.gsap && !reduceMotion) {
        gsap.fromTo('.skill-card',
          { y: 40, opacity: 0, scale: 0.9, rotateY: -8 },
          { y: 0, opacity: 1, scale: 1, rotateY: 0, duration: 0.6, stagger: 0.045, ease: "back.out(1.2)", onComplete: () => {
            document.querySelectorAll('.skill-card').forEach(c => c.style.transform = '');
          }}
        );
      }
    }

    // initial render
    renderSkills();

    // filter click handlers
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        playTick();
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderSkills(btn.getAttribute('data-filter'));
      });
    });

    // mouse light follow
    if (!reduceMotion && window.innerWidth > 1024) {
      document.addEventListener('mousemove', (e) => {
        const light = document.getElementById('mouseLight');
        if (light) {
          light.style.left = e.clientX + 'px';
          light.style.top = e.clientY + 'px';
        }
      });
    }

    // preload icons
    window.addEventListener('load', () => {
      skillsData.forEach(s => { const img = new Image(); img.src = s.icon; });
    });
  </script>
</body>
</html>
